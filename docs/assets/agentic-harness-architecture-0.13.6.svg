<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Harness architecture</title>
  <desc id="desc">The Harness owns the objective and independent completion gate. It can use an embedded worker or an optional managed runtime, which can call a local or cloud model provider.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f0"/>
      <stop offset="1" stop-color="#e6f0ed"/>
    </linearGradient>
    <linearGradient id="harness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#246f68"/>
      <stop offset="1" stop-color="#123d3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183b38" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#246f68"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="32" fill="url(#bg)"/>
  <text x="72" y="78" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">One completion gate, many runtimes</text>
  <text x="72" y="116" fill="#52635f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">Keep task identity, evidence, and verification separate from model execution.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="410" height="310" rx="24" fill="url(#harness)"/>
    <text x="104" y="242" fill="#b8e5de" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">AGENTIC HARNESS</text>
    <text x="104" y="288" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="29" font-weight="700">Objective → work → proof</text>
    <text x="104" y="331" fill="#d9eeea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">• task identity and scope</text>
    <text x="104" y="365" fill="#d9eeea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">• bounded actions and evidence</text>
    <text x="104" y="399" fill="#d9eeea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19">• independent deterministic review</text>
    <rect x="104" y="432" width="300" height="40" rx="20" fill="#b7df82"/>
    <text x="254" y="458" text-anchor="middle" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">Verified · Blocked · Failed</text>
  </g>

  <path d="M480 270H620" stroke="#246f68" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M480 420H620" stroke="#246f68" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="640" y="180" width="250" height="130" rx="22" fill="#fff" stroke="#8fb9b1" stroke-width="3"/>
    <text x="675" y="224" fill="#246f68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="1">DEFAULT</text>
    <text x="675" y="263" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700">Embedded worker</text>
    <text x="675" y="290" fill="#52635f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">One install, one workspace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="350" width="250" height="130" rx="22" fill="#fff" stroke="#d3b981" stroke-width="3"/>
    <text x="675" y="394" fill="#9b6b24" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="1">OPTIONAL</text>
    <text x="675" y="433" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700">Managed runtime</text>
    <text x="675" y="460" fill="#52635f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Local Studio or another adapter</text>
  </g>

  <path d="M890 245H970" stroke="#246f68" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M890 415H970" stroke="#246f68" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="990" y="180" width="150" height="310" rx="22" fill="#fff" stroke="#c6d1cd" stroke-width="3"/>
    <text x="1015" y="222" fill="#246f68" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="1">PROVIDERS</text>
    <text x="1015" y="270" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">vLLM</text>
    <text x="1015" y="308" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">Ollama</text>
    <text x="1015" y="346" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">LM Studio</text>
    <text x="1015" y="384" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">llama.cpp</text>
    <text x="1015" y="422" fill="#183b38" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">Cloud API</text>
    <text x="1015" y="462" fill="#52635f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">operator chosen</text>
  </g>

  <text x="70" y="575" fill="#52635f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">The provider supplies inference. The Harness supplies the acceptance decision.</text>
</svg>
