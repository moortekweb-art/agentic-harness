[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agentic-harness"
version = "0.13.6"
description = "Run coding agents and only mark work done when independent checks pass."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{ name = "Michael / Moortekweb" }]
keywords = ["agents", "ai", "automation", "local-first", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/moortekweb-art/agentic-harness"
Repository = "https://github.com/moortekweb-art/agentic-harness"
Issues = "https://github.com/moortekweb-art/agentic-harness/issues"
Changelog = "https://github.com/moortekweb-art/agentic-harness/blob/main/docs/RELEASE_NOTES_0.13.6.md"

[project.optional-dependencies]
test = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "ruff==0.15.22",
    "twine>=5.1",
    "types-PyYAML>=6.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agentic_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds a real artifact or otherwise takes minutes (deselect with -m 'not slow')",
]

[project.scripts]
agentic-harness = "agentic_harness.cli:main"
agentic-harness-gui = "agentic_harness.gui.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_harness*"]

[tool.setuptools.package-data]
agentic_harness = ["recipes/*.yml"]
# Exact paths, never a glob: setuptools package-data matches untracked files
# too, so "static/*" — or even "static/*.js" — would sweep an operator's local
# services.local.json, or a stray evil.js, into a locally built wheel. Adding a
# static asset means adding it here; tests/test_portal_confidentiality.py fails
# if a tracked asset is missing from this list.
"agentic_harness.gui" = [
    "static/app.js",
    "static/assurance.js",
    "static/auth.js",
    "static/favicon.svg",
    "static/icons-custom.LICENSE",
    "static/icons-custom.svg",
    "static/illustrations/local-ai-connection.webp",
    "static/illustrations/setup-recovery.webp",
    "static/illustrations/verified-archive.webp",
    "static/index.html",
    "static/portal.css",
    "static/portal.html",
    "static/portal.js",
    "static/services.example.json",
    "static/styles.css",
]
